# SOC Home Lab - Phase 1: lab targets
#
# Security decisions:
# - No ports are published ("ports:"). The containers are only reachable
#   from the laptop itself, through the 172.30.0.0/24 network.
#   This matters because Docker bypasses the ufw firewall for published ports.
# - The network interface has a fixed name (br-lab) so the IDS can listen on it in Phase 3.

name: soc-lab

services:
  vitima-ssh:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: vitima-ssh
    hostname: vitima-ssh
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - USER_NAME=${SSH_USER}
      - USER_PASSWORD=${SSH_PASSWORD}
      - PASSWORD_ACCESS=true      # password login enabled on purpose (brute force target)
      - SUDO_ACCESS=false
    volumes:
      - ./data/ssh:/config        # SSH logs are stored in ./data/ssh/logs/openssh/
    networks:
      lab:
        ipv4_address: 172.30.0.10
    restart: "no"                 # only runs when the lab is started
    mem_limit: 128m

  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: juice-shop
    hostname: juice-shop
    networks:
      lab:
        ipv4_address: 172.30.0.20
    restart: "no"
    mem_limit: 384m

networks:
  lab:
    name: lab
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-lab
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
